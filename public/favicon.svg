<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="c">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1A"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="#1a1c1a"/>
  <!-- Flower of Life circles, clipped to boundary -->
  <g clip-path="url(#c)" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.95">
    <!-- Center -->
    <circle cx="32" cy="32" r="13"/>
    <!-- 6 petals -->
    <circle cx="32" cy="19" r="13"/>
    <circle cx="43.3" cy="25.5" r="13"/>
    <circle cx="43.3" cy="38.5" r="13"/>
    <circle cx="32" cy="45" r="13"/>
    <circle cx="20.7" cy="38.5" r="13"/>
    <circle cx="20.7" cy="25.5" r="13"/>
    <!-- Outer ring (6 more) -->
    <circle cx="32" cy="6" r="13"/>
    <circle cx="54.6" cy="19" r="13"/>
    <circle cx="54.6" cy="45" r="13"/>
    <circle cx="32" cy="58" r="13"/>
    <circle cx="9.4" cy="45" r="13"/>
    <circle cx="9.4" cy="19" r="13"/>
    <!-- Outer boundary circle -->
    <circle cx="32" cy="32" r="29"/>
  </g>
</svg>
