name: Bio-Hofläden Qualitätsprüfung

on:
  push:
    branches: [main]
    paths: ['scripts/hoflaeden-pruefung/run.txt']
  workflow_dispatch: {}
  schedule:
    - cron: '15 4 15 * *'

concurrency:
  group: hoflaeden-pruefung
  cancel-in-progress: true

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q requests
      - env:
          SUPABASE_URL: https://dgffntczrhwujjtvbytj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/hoflaeden-pruefung/check.py
